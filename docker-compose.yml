# Work PC stack only — relay, agent, dashboard. Postgres is Neon (managed,
# see relay/.env and agent/.env) so drivers/stints/incidents persist across
# every device hitting the tunnel, not just this machine. The collector is
# intentionally not here either: it has to run natively on the Sim PC's
# Windows install to reach iRacing's shared memory directly, which Docker
# doesn't help with and only adds friction to.
#
# DATABASE_URL below comes from a root-level .env (gitignored — see
# .env.example) that Compose loads automatically for variable substitution;
# it's the same Neon connection string as relay/.env and agent/.env.
services:
  relay:
    build: ./relay
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 4000

    develop:
      watch:
        - action: sync+restart
          path: ./relay
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - package.json
            - package-lock.json
            - Dockerfile

        - action: rebuild
          path: ./relay/package.json

        - action: rebuild
          path: ./relay/package-lock.json

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "4100:4100"
      - "4101:4101"
    environment:
      AGENT_PORT: 4100
      DASHBOARD_PORT: 4101
      DATABASE_URL: ${DATABASE_URL}

    develop:
      watch:
        - action: sync+restart
          path: ./agent
          target: /app/agent
          initial_sync: true
          ignore:
            - node_modules/
            - __pycache__/
            - "*.pyc"
            - Dockerfile

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    environment:
      RELAY_PROXY_TARGET: http://relay:4000
      AGENT_PROXY_TARGET: ws://agent:4101
    volumes:
      # Persist Vite's dep pre-bundle cache across container recreations.
      # Without this, every `docker compose up` re-scans/re-bundles deps
      # from scratch, which can race with the first render and produce
      # "Invalid hook call" from a mid-load dependency re-optimize
      # (same class of issue as the optimizeDeps.include below).
      - dashboard_vite_cache:/app/node_modules/.vite
    depends_on:
      - relay
      - agent

    develop:
      watch:
        - action: sync
          path: ./dashboard
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - package.json
            - package-lock.json
            - Dockerfile

        - action: rebuild
          path: ./dashboard/package.json

        - action: rebuild
          path: ./dashboard/package-lock.json

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    # Credentials/cert files on the host are owner-only (0600/0700, uid
    # 1000); the image's default nonroot user can't read them otherwise.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Named tunnel credentials/config live on the host at ~/.cloudflared —
      # config.yml points its ingress at http://dashboard:5173, the
      # in-network service name (not localhost, which inside this
      # container means the cloudflared container itself).
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - dashboard
    restart: unless-stopped

volumes:
  dashboard_vite_cache:
